name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calver.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate CalVer
        id: calver
        shell: bash
        run: |
          base=$(date -u +%Y.%m.%d)
          highest=-1

          while IFS= read -r tag; do
            if [[ $tag == "$base" ]] && (( highest < 0 )); then
              highest=0
            elif [[ $tag == "$base."* ]]; then
              suffix=${tag#"$base."}
              if [[ $suffix =~ ^[0-9]+$ ]] && (( 10#$suffix > highest )); then
                highest=$((10#$suffix))
              fi
            fi
          done < <(git tag --list "$base*")

          if (( highest < 0 )); then
            version=$base
          else
            version="$base.$((highest + 1))"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Test
        run: make test

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          asset="poundai-${GOOS}-${GOARCH}"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/elee1766/poundai/pkg/cli.Version=${VERSION}" \
            -o "dist/$asset" ./cmd/poundai

      - uses: actions/upload-artifact@v7
        with:
          name: poundai-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/poundai-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  release:
    needs:
      - version
      - build
      - test
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cp config.example.yaml dist/config.example.yaml
          cp install.sh dist/install.sh
          cd dist
          sha256sum ./poundai-* ./config.example.yaml ./install.sh > checksums.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/poundai-*
            dist/install.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: >-
          gh release create "$VERSION"
          dist/poundai-* dist/config.example.yaml dist/install.sh dist/checksums.txt
          --target "$GITHUB_SHA"
          --title "poundai $VERSION"
          --generate-notes
